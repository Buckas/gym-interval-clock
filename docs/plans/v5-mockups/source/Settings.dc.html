<body>
<x-dc>
<helmet>

<main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">Settings</h1>
<div style="font-size: 13px; color: #A7B0BC">Changes apply straight away</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start">

<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px">

<section style="background: #1B2027; border: 1px solid #2A313B; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Display layout</h2>
<div role="group" aria-label="Display layout" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button type="button" aria-pressed="true" style="padding: 8px; border-radius: 10px; border: 2px solid #5AA2FF; background: #1C2733; color: #F1F3F6; font: inherit; display: flex; flex-direction: column; gap: 8px; align-items: stretch">
<span aria-hidden="true" style="height: 70px; border-radius: 6px; background: #0F8A46; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px; padding: 5px"><span style="background: #0A6634; border-radius: 3px"></span><span style="display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; color: #FFFFFF">34</span></span>
<span style="font-size: 13px; font-weight: 700">Standard</span>
</button>
<button type="button" aria-pressed="false" style="padding: 8px; border-radius: 10px; border: 1px solid #3A4450; background: #232A33; color: #F1F3F6; font: inherit; display: flex; flex-direction: column; gap: 8px; align-items: stretch">
<span aria-hidden="true" style="height: 70px; border-radius: 6px; background: #0F8A46; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: 800; color: #FFFFFF">34</span>
<span style="font-size: 13px; font-weight: 600">Big number</span>
</button>
<button type="button" aria-pressed="false" style="padding: 8px; border-radius: 10px; border: 1px solid #3A4450; background: #232A33; color: #F1F3F6; font: inherit; display: flex; flex-direction: column; gap: 8px; align-items: stretch">
<span aria-hidden="true" style="height: 70px; border-radius: 6px; background: #0F8A46; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 5px"><span style="background: #0A6634; border-radius: 3px"></span><span style="display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: #FFFFFF">34</span></span>
<span style="font-size: 13px; font-weight: 600">Stations</span>
</button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Safe margin for projectors that cut off the edges: 2%<input type="range" min="0" max="8" value="2" style="width: 100%; accent-color: #5AA2FF"></label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #5AA2FF">Show the control bar when the mouse moves</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 40px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #5AA2FF">Reduce motion (no fades or pulses)</label>
</section>

<section style="background: #1B2027; border: 1px solid #2A313B; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Phase colours</h2>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 8px; border: 0; background: #0F8A46; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">Work</button>
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 8px; border: 0; background: #A85A12; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">Rest</button>
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 8px; border: 0; background: #2B63B8; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">Recovery</button>
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 8px; border: 0; background: #176F78; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">Move</button>
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 8px; border: 0; background: #1E55B3; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">Get ready</button>
<button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 8px; border: 0; background: #5B4B9E; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700">Finished</button>
</div>
<div style="font-size: 13px; color: #A7B0BC">Click a colour to change it. Today this needs the settings file.</div>
</section>

</div>

<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px">

<section style="background: #1B2027; border: 1px solid #2A313B; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Appearance</h2>
<div role="group" aria-label="Theme for the Control window" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: #0D1014; border-radius: 10px; padding: 4px">
<button type="button" aria-pressed="true" style="min-height: 40px; border-radius: 7px; border: 0; background: #1C2733; color: #F1F3F6; font: inherit; font-size: 14px; font-weight: 600">Follow Windows</button>
<button type="button" aria-pressed="false" style="min-height: 40px; border-radius: 7px; border: 0; background: #0D1014; color: #A7B0BC; font: inherit; font-size: 14px">Light</button>
<button type="button" aria-pressed="false" style="min-height: 40px; border-radius: 7px; border: 0; background: #0D1014; color: #A7B0BC; font: inherit; font-size: 14px">Dark</button>
</div>
</section>

<section style="background: #1B2027; border: 1px solid #2A313B; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Sound</h2>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #5AA2FF">Play the sound cues</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px">Volume: 85%<input type="range" min="0" max="100" value="85" style="width: 100%; accent-color: #5AA2FF"></label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px">Get-ready countdown<input type="number" value="10" min="0" max="300" style="min-height: 40px; width: 80px; box-sizing: border-box; border-radius: 8px; border: 1px solid #3A4450; background: #12151A; color: #F1F3F6; font: inherit; font-size: 14px; padding: 0 10px">seconds</label>
</section>

<section style="background: #1B2027; border: 1px solid #2A313B; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Clock and stations</h2>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #5AA2FF">Show the time of day</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px">Time format<select style="min-height: 40px; box-sizing: border-box; border-radius: 8px; border: 1px solid #3A4450; background: #12151A; color: #F1F3F6; font: inherit; font-size: 14px; padding: 0 10px"><option>8:39 PM</option><option>20:39</option><option>8:39:22 PM</option></select></label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #5AA2FF">Keep the Display on top of other windows</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 40px"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #5AA2FF">Show the station list on the Display</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px; min-height: 40px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #5AA2FF">Show the station name instead of WORK / REST</label>
</section>

</div>
</div>
</main>
</div>
