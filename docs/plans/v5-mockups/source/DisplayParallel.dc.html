<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Display, Parallel tiles with the control bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F1F3F6}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; background: #12151A; color: #FFFFFF; font-family: 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif; padding: 22px 32px 14px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 24px; font-weight: 700">Everest Session 1 - The Journey Begins</div>
<div style="font-size: 16px; font-weight: 500; color: #C9D1DB">Session 00:06</div>
</div>
<div style="font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums">8:39 PM</div>
</div>

<div style="text-align: center; font-size: 30px; font-weight: 800; letter-spacing: 0.03em">ROTATION 1 OF 4 &nbsp;·&nbsp; ROTATE IN 7:54</div>

<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; min-height: 0">

<section style="background: #0F8A46; border-radius: 20px; padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<div style="align-self: flex-start; font-size: 26px; font-weight: 800">Bike</div>
<div style="font-size: 34px; font-weight: 800; letter-spacing: 0.04em; padding-top: 6px">WORK</div>
<div style="font-size: 19px; font-weight: 600; min-height: 50px">High intensity</div>
<div style="flex-grow: 1; display: flex; align-items: center; font-size: 132px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">34</div>
<div role="img" aria-label="34 of 40 seconds left" style="align-self: stretch; height: 12px; border-radius: 6px; background: #0A6634; overflow: hidden"><div style="width: 85%; height: 12px; border-radius: 6px; background: #FFFFFF"></div></div>
</section>

<section style="background: #0F8A46; border-radius: 20px; padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<div style="align-self: flex-start; font-size: 26px; font-weight: 800">Treadmill</div>
<div style="font-size: 34px; font-weight: 800; letter-spacing: 0.04em; padding-top: 6px">WORK</div>
<div style="font-size: 19px; font-weight: 600; min-height: 50px">Run at 80%</div>
<div style="flex-grow: 1; display: flex; align-items: center; font-size: 132px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">54</div>
<div role="img" aria-label="54 of 60 seconds left" style="align-self: stretch; height: 12px; border-radius: 6px; background: #0A6634; overflow: hidden"><div style="width: 90%; height: 12px; border-radius: 6px; background: #FFFFFF"></div></div>
</section>

<section style="background: #A85A12; border-radius: 20px; padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<div style="align-self: flex-start; font-size: 26px; font-weight: 800">Skipping</div>
<div style="font-size: 34px; font-weight: 800; letter-spacing: 0.04em; padding-top: 6px">REST</div>
<div style="font-size: 19px; font-weight: 600; min-height: 50px">Rope down</div>
<div style="flex-grow: 1; display: flex; align-items: center; font-size: 132px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">12</div>
<div role="img" aria-label="12 of 20 seconds left" style="align-self: stretch; height: 12px; border-radius: 6px; background: #7C420C; overflow: hidden"><div style="width: 60%; height: 12px; border-radius: 6px; background: #FFFFFF"></div></div>
</section>

<section style="background: #2B63B8; border-radius: 20px; padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<div style="align-self: flex-start; font-size: 26px; font-weight: 800">Floor</div>
<div style="font-size: 34px; font-weight: 800; letter-spacing: 0.04em; padding-top: 6px">RECOVER</div>
<div style="font-size: 19px; font-weight: 600; min-height: 50px">Rotating soon</div>
<div style="flex-grow: 1; display: flex; align-items: center; font-size: 110px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums">1:20</div>
<div role="img" aria-label="1 minute 20 of 2 minutes left" style="align-self: stretch; height: 12px; border-radius: 6px; background: #1E4A8C; overflow: hidden"><div style="width: 66%; height: 12px; border-radius: 6px; background: #FFFFFF"></div></div>
</section>

</div>

<div aria-label="Controls, shown when the mouse moves" style="align-self: center; background: #232A33; border: 1px solid #3A4450; border-radius: 16px; padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center">
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #2F3843; color: #F1F3F6; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5v14M9 12l10-7v14z"></path></svg>Back</button>
<button type="button" style="min-height: 44px; padding: 0 22px; border-radius: 10px; border: 0; background: #5AA2FF; color: #0B1220; font: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg>Pause</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #2F3843; color: #F1F3F6; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5v14M15 12L5 5v14z"></path></svg>Skip</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #2F3843; color: #F1F3F6; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v5h5"></path></svg>Reset</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #2F3843; color: #F1F3F6; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10zM17 9a4 4 0 0 1 0 6"></path></svg>Sound</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #2F3843; color: #F1F3F6; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="10" height="8" rx="1.5"></rect><rect x="11" y="11" width="10" height="8" rx="1.5"></rect></svg>Link</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #2F3843; color: #F1F3F6; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>Controls</button>
<button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #2F3843; color: #F1F3F6; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>Full screen</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; font-size: 13px; font-weight: 600; color: #C9D1DB">
<div>Licensed to [School name]</div>
<div style="text-align: center">LINKED · 1 SECOND SCREEN</div>
<div style="text-align: right">© [Authors] 2026</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
